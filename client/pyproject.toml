[project]
name = "senko-client"
version = "0.1.1"
description = "Senko desktop microphone and audio playback client"
readme = "README.md"
authors = [
    { name = "BorozdinDanylo", email = "borozdindanil@gmaiil.com" }
]
requires-python = ">=3.14"
dependencies = [
    "senko-protocol",
    "typer>=0.29.1",
]

[build-system]
requires = ["uv_build>=0.11.4,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
senko-protocol = { workspace = true }

[project.scripts]
senko = "senko_client.senko_cli:app"
